[workspace]
resolver = "3"
members = [
    "crates/radovid",
    "crates/radovid_client",
    "crates/radovid_proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# bota at the commit radovid is built against (e6c4442), as a detached worktree beside this one:
# `git -C <bota> worktree add --detach ../bota-radovid-pin <commit>`. The game servers the service
# starts must come from the same commit: a bota wire change means moving this pin.
bota_client_core = { path = "../bota-radovid-pin/crates/bota_client_core" }
bota_core = { path = "../bota-radovid-pin/crates/bota_core" }
bota_proto = { path = "../bota-radovid-pin/crates/bota_proto" }
bota_server = { path = "../bota-radovid-pin/crates/bota_server" }
radovid_client = { path = "crates/radovid_client" }
radovid_proto = { path = "crates/radovid_proto" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.clippy]
unwrap_used = "warn"

# Tests run the password hash, the game server and the TLS stack: optimise every
# dependency even in the dev profile.
[profile.dev.package."*"]
opt-level = 3
