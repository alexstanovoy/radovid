# Development-only fixtures: run from the repository root, after `radovid dev-cert dev/`.
# The game processes live under tests/ and are never built into the service.
listen = "127.0.0.1:4460"
database = "dev/radovid.db"
tls_cert = "dev/cert.pem"
tls_key = "dev/key.pem"
game_ports = "20000-20015"
lobby_teams = [1, 1]
lobby_ruleset = "tic_tac_toe"

# [limits]
# games_per_account = { human = 0, bot = 0 } # unlimited per account; service/source bounds remain
# games_per_source = 8                     # tune for shared NATs
# games_per_ipv6_48 = 64
# custom_match_capacity = 256

[[ruleset]]
id = "tic_tac_toe"
name = "Tic-tac-toe fixture"
game = "ttt"
game_fingerprint = "7474740000000001"
teams = [1, 1]
rated = true
lobby_min_players = 2
max_duration_secs = 180
[ruleset.launcher]
kind = "local"
binary = "python3"
public_url = "tcp://127.0.0.1:{port}"
version_probe = ["crates/radovid/tests/fixtures/game_server.py", "--game", "ttt", "--probe"]
args = ["crates/radovid/tests/fixtures/game_server.py", "--game", "ttt", "--port", "{port}"]
env = { GAME_SEATS = "{seats}" }

[[ruleset]]
id = "clock"
name = "Turn-clock fixture"
game = "clock"
game_fingerprint = "636c6f636b000001"
teams = [1, 1]
rated = true
lobby_min_players = 2
info = "3330303030"                       # game-owned bytes: "30000"
max_duration_secs = 180
[ruleset.launcher]
kind = "local"
binary = "python3"
public_url = "tcp://127.0.0.1:{port}"
version_probe = ["crates/radovid/tests/fixtures/game_server.py", "--game", "clock", "--probe"]
args = ["crates/radovid/tests/fixtures/game_server.py", "--game", "clock", "--port", "{port}", "--clock-ms", "30000"]
env = { GAME_SEATS = "{seats}" }

[[ruleset]]
id = "grid"
name = "Fixed-tick duel fixture"
game = "grid"
game_fingerprint = "6772696400000001"
teams = [1, 1]
rated = true
lobby_min_players = 2
max_duration_secs = 180
[ruleset.launcher]
kind = "local"
binary = "python3"
public_url = "tcp://127.0.0.1:{port}"
version_probe = ["crates/radovid/tests/fixtures/game_server.py", "--game", "grid", "--probe"]
args = ["crates/radovid/tests/fixtures/game_server.py", "--game", "grid", "--port", "{port}"]
env = { GAME_SEATS = "{seats}" }

