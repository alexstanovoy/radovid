# A service hosts replaceable game servers implementing DEVELOPMENT.md's launcher contract.
# Image names, fingerprints and arguments below are examples: supply your games' own values.
listen = "0.0.0.0:4460"
database = "radovid.db"
tls_cert = "/etc/radovid/cert.pem"
tls_key = "/etc/radovid/key.pem"
game_ports = "20000-20100"
lobby_ruleset = "duel"
# lobby_teams = [1, 1]                     # explicit layout shared by custom lobbies

# [limits]
# games_per_account = { human = 0, bot = 0 } # 0: no account cap; source/service capacities still apply
# games_per_source = 8

# [web]
# static_dir = "/srv/radovid/page"
# send_deadline_secs = 600

[[ruleset]]
id = "duel"
name = "Board duel"
game = "example_board"
game_fingerprint = "0123456789abcdef"
teams = [1, 1]
rated = true
# info = "0102"                            # opaque game parameters for its clients
max_duration_secs = 10800                  # operational deadline, independent of the game's clock

[ruleset.launcher]
kind = "docker"
image = "example_board_server:latest"
container_port = 9000
public_url = "wss://board.example.org:{port}"
version_probe = ["--wire-fingerprint"]
args = ["--port", "9000", "--match-id", "{match_id}", "--clock-seconds", "300"]
env = { GAME_SEATS = "{seats}" }           # tickets only in environment, never arguments

[ruleset.artifacts.record]
path = "/var/lib/radovid/records/record-{match_id}.pgn"
args = ["--record", "{artifact}"]
max_kib = 1024
access = "seats"

[[ruleset]]
id = "teams"
name = "Arena teams"
game = "example_arena"
game_fingerprint = "fedcba9876543210"
teams = [2, 2]                            # may also be unequal, or [1, 1, 1] for free-for-all
rated = true
max_duration_secs = 1800

[ruleset.launcher]
kind = "docker"
image = "example_arena_server:latest"
container_port = 9000
public_url = "wss://arena.example.org:{port}"
version_probe = ["--wire-fingerprint"]
args = ["--port", "9000", "--match-id", "{match_id}", "--tick-rate", "60"]
env = { GAME_SEATS = "{seats}" }

# One-player practice is optional and has no queue or ladder.
[[ruleset]]
id = "demo"
name = "Arena practice"
game = "example_arena"
game_fingerprint = "fedcba9876543210"
teams = [1, 1]
rated = false
instant_solo = true
max_duration_secs = 7200

[ruleset.launcher]
kind = "docker"
image = "example_arena_server:latest"
container_port = 9000
public_url = "wss://arena.example.org:{port}"
version_probe = ["--wire-fingerprint"]
args = ["--port", "9000", "--practice"]
env = { GAME_SEATS = "{seats}" }
cheats_args = ["--cheats"]
