# radovid: the least a service needs; every other key and its default is in the README.
# Run: radovid serve --config radovid.toml

listen = "0.0.0.0:4460"
database = "radovid.db"                    # created 0600
tls_cert = "/etc/radovid/play-cert/fullchain.pem"
tls_key = "/etc/radovid/play-cert/privkey.pem"   # refused if every user may read it
game_ports = "20000-20100"                 # one host port per running match

# [web]
# static_dir = "/srv/radovid/page"          # a web client served on this origin, beside /control

# bota's solo mid, one docker container per match. Its server speaks wss:// on 4456 inside the
# container; plain TCP stays on the container's loopback.
[[ruleset]]
id = "solo_mid"
name = "1x1 Mid Only"
game = "bota"
game_fingerprint = "0123456789abcdef"      # what `bota_server --wire-fingerprint` prints
teams = [1, 1]
rated = true
info = "0100"                              # bota: the allowed heroes
# lobby_min_players = 1                    # a lobby may start with its host alone (the game fills the seats)
# audience = "everyone"                    # or "humans_only" / "bots_only"

[ruleset.launcher]
kind = "docker"
image = "bota_server:7f6489e"
container_port = 4456
public_url = "wss://game.example.org:{port}"
mounts = ["/etc/radovid/game-cert:/certs:ro"]
version_probe = ["--wire-fingerprint"]
args = ["--map", "2", "--match-id", "{match_id}", "--bind", "0.0.0.0", "--ws-port", "4456",
        "--tls-cert", "/certs/fullchain.pem", "--tls-key", "/certs/privkey.pem",
        "--heroes", "1", "--start-after-secs", "60", "--abandon-unjoined", "--empty-after-secs", "300",
        "--replay", "{artifact}"]
env = { BOTA_SEATS = "{seats}" }           # tickets go into the environment only; each seat is ticket:team:name:kind (bot|human, the account's own)

# The replay of each match, kept for its seats: radovid makes the file and mounts just that one writable at
# /artifact in the container; the game writes it where `{artifact}` says.
artifact = "/var/lib/radovid/replays/replay-{match_id}.brp"
