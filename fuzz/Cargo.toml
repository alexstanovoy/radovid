# Coverage-guided fuzz targets for everything radovid reads from a peer, a
# game server or a file. A workspace of its own: the fuzzer's flags and
# libFuzzer stay out of the main build. `fuzz.sh` builds and runs them on
# stable Rust.
[package]
name = "radovid_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
radovid = { path = "../crates/radovid" }
radovid_client = { path = "../crates/radovid_client" }
radovid_proto = { path = "../crates/radovid_proto" }
libfuzzer-sys = "0.4"
serde = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "signal"] }
toml = "1"

[workspace]
members = ["."]

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "launcher_lines"
path = "fuzz_targets/launcher_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_file"
path = "fuzz_targets/config_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_session"
path = "fuzz_targets/hub_session.rs"
test = false
doc = false
bench = false
